name: no-gpu-smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integrity:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check manifests, wheels and installer safety
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/Smoke.ps1
      - name: Run standalone unit and publication checks
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v
